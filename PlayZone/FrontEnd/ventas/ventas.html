<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayZone</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="ventas.css">
    <script src="ventas.js" defer></script>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="../inicio/inicio.html">PlayZone</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="../inicio/inicio.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../productos/productos.html">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Ventas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../dashboard/dashboard.html">Dashboard</a>
                        </li>
                        <li class="nav-item">
                           <a class="nav-link" href="../acerca/acerca.html">Acerca de</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div class="container py-4">
            <h1 class="h3 mb-4 aquaText">Órdenes de compra</h1>

            <form id="formulario" class="row g-3 mb-4">
                <input type="hidden" id="idOrden">
    
                <div class="col-md-4">
                    <label class="form-label aquaText">ID usuario</label>
                    <input type="number" id="idUsuario" class="form-control" min="1" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label aquaText">ID método de pago</label>
                    <input type="number" id="idMetodoPago" class="form-control" min="1" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label aquaText">ID moneda</label>
                    <input type="number" id="idMoneda" class="form-control" min="1" required>
                </div>
    
                <div class="col-12">
                    <label class="form-label aquaText">Productos</label>
                    <div id="detalles"></div>
                    <button type="button" id="btnAgregar" class="btn btn-sm btn-outline-primary">+ Agregar producto</button>
                </div>
            
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Crear/Editar</button>
                    <button type="button" id="btnCancelar" class="btn btn-secondary">Limpiar</button>
                    <p class="aquaText">(seleccione editar en una orden de abajo para editar)</p>
                </div>
            </form>
    
            <div class="border rounded-3 overflow-hidden">
                <table class="table table-striped mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Fecha</th>
                        <th>Pago</th>
                        <th>Moneda</th>
                        <th>Estado</th>
                        <th>Productos</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
        </div>
        <script src="ventas.js"></script>
    </main>
    <footer>

    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - PlayZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../login/login.css">
    <script src="registro.js" defer></script>
</head>
<body>
    <header>
        <div class="titleContainer">
            <h1 class="title aquaText">PLAYZONE</h1>
        </div>
    </header>
    <main class="content">
        <div class="container mt-4 mb-5">
            <form id="registerForm">
                <div class="mb-3">
                    <label for="username" class="form-label aquaText">Nombre de usuario</label>
                    <input type="text" class="form-control" id="username" maxlength="50" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label aquaText">Email</label>
                    <input type="email" class="form-control" id="email" maxlength="254" required>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label aquaText">Nombre</label>
                    <input type="text" class="form-control" id="name" maxlength="100" required>
                </div>
                <div class="mb-3">
                    <label for="lastName" class="form-label aquaText">Apellido</label>
                    <input type="text" class="form-control" id="lastName" maxlength="100" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label aquaText">Contraseña</label>
                    <input type="password" class="form-control" id="password" minlength="8" required>
                </div>
                <div class="mb-3">
                    <label for="birthDate" class="form-label aquaText">Fecha de nacimiento</label>
                    <input type="date" class="form-control" id="birthDate" required>
                </div>
                <div class="mb-3">
                    <label for="countryId" class="form-label aquaText">País</label>
                    <select class="form-select" id="countryId" required>
                        <option value="">Seleccione un país</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Registrarse</button>
                <a class="btn btn-secondary" href="../login/login.html">Volver al login</a>
                <p id="error"></p>
            </form>
        </div>
    </main>
</body>
</html>

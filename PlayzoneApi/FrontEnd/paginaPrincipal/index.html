
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayZone - Inicio</title>

    <script>
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.replace('../login/login.html');
        }
    </script>
</head>
<body>
    <h1>ENTRASTE</h1>
    <button id="btnProbarProductos">
    Probar conexión con productos
</button>

<pre id="resultadoProductos"></pre>

<button id="btnCerrarSesion">Cerrar sesión</button>

<script>
    document.getElementById('btnCerrarSesion').addEventListener('click', function () {
        localStorage.removeItem('token');
        window.location.replace('../login/login.html');
    });
</script>

<script>
    document.getElementById('btnProbarProductos').addEventListener('click', async function () {

        const token = localStorage.getItem('token');
        const resultado = document.getElementById('resultadoProductos');

        try {
            const response = await fetch('https://localhost:7239/api/Productos', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error(`Error HTTP: ${response.status}`);
            }

            const productos = await response.json();

            resultado.textContent = JSON.stringify(productos, null, 4);

        } catch (error) {
            resultado.textContent = error.message;
        }
    });
</script>

</body>
</html>
